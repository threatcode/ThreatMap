name: Publish one independent SDK package

on:
  workflow_call:
    inputs:
      package:
        description: Independent package to publish
        required: true
        type: string
      ref:
        description: Immutable <package>-vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: sdk-registry-channels
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable package tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify package and tag
        env:
          PACKAGE: ${{ inputs.package }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          case "$PACKAGE" in
            quickjs-types|sdk-shared|server-auth|sdk-client) ;;
            *) echo "Unsupported independent package: $PACKAGE" >&2; exit 1 ;;
          esac
          version="$(node -p "require('./packages/$PACKAGE/package.json').version")"
          test "$RELEASE_REF" = "$PACKAGE-v$version"
          tag_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_REF")"
          test -n "$tag_sha"
          test "$(git rev-parse HEAD)" = "$tag_sha"
          test -z "$(git branch --show-current)"

      - name: Install lockfile-pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Build selected package graph
        env:
          PACKAGE: ${{ inputs.package }}
        run: pnpm -r --if-present --filter "@threatmap/$PACKAGE..." build

      - name: Publish selected package to npm
        env:
          PACKAGE: ${{ inputs.package }}
        run: | # zizmor: ignore[use-trusted-publishing] Independent npm packages use NPM_PUBLISH_TOKEN
          npm publish "./packages/$PACKAGE" --access public --registry https://registry.npmjs.org
