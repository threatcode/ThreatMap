name: SDK Client Tests

on:
  push:
    branches:
      - 'main'
    paths:
      - 'packages/sdk-client/**'
  pull_request:
    paths:
      - 'packages/sdk-client/**'

concurrency:
  group: sdk-client-tests-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-sdk-client:
    name: Test SDK Client (${{ matrix.threatmap-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        threatmap-version:
          - 0.56.0
          - 0.57.0
          - 0.58.0

    services:
      threatmap:
        image: threatcode/threatmap:${{ matrix.threatmap-version }}
        ports:
          - 8080:8080
        env:
          THREATMAP_REGISTRATION_KEY: ${{ secrets.THREATMAP_REGISTRATION_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install dependencies
        run: pnpm install

      - name: Run sdk-client tests
        run: pnpm --filter @threatmap/sdk-client test
        env:
          THREATMAP_PAT: ${{ secrets.THREATMAP_PAT }}
          THREATMAP_INSTANCE_URL: http://localhost:8080
